name: CTI Alertas

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 min, fuera del minuto 0
  workflow_dispatch:

permissions:
  contents: write                   # solo para guardar los estados

concurrency:
  group: cti-alertas
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests feedparser

      - name: Alertas CVE (KEV + NVD)
        run: python alertas.py

      - name: Alertas noticias (RSS)
        if: always()                # corre aunque falle el paso anterior
        run: python noticias.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json state_noticias.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "estado: $(date -u +%FT%TZ)"
            git pull --rebase
            git push
          fi
